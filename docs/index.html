<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="전의진의 공개 프로젝트 사이트 모음">
  <title>전의진 · 프로젝트</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #182337; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 68rem; margin: auto; padding: clamp(2rem, 8vw, 6rem) clamp(1.25rem, 6vw, 4rem); }
    header { border-top: .25rem solid #244fc9; padding-block: 1.5rem 2rem; }
    h1 { margin: .25rem 0 1rem; font-size: clamp(2.5rem, 9vw, 5rem); line-height: 1.1; letter-spacing: -.06em; }
    p { margin: 0; line-height: 1.65; color: #485870; }
    .owner { color: #244fc9; font-weight: 700; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: 1rem; }
    li { padding: 1.5rem; border: 1px solid #d5deef; border-radius: .8rem; background: white; }
    h2 { margin: 0 0 .65rem; font-size: 1.5rem; }
    a { color: #234bbd; text-underline-offset: .2em; }
    a:hover { color: #132c7a; }
    a:focus-visible { outline: 2px solid #244fc9; outline-offset: 4px; }
    footer { margin-top: 2rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="owner">전의진</p>
      <h1>프로젝트</h1>
      <p>GitHub에 공개한 프로젝트 사이트 모음입니다.</p>
    </header>
    <ul aria-label="프로젝트 사이트">
      <li>
        <h2><a href="https://euijinjeon.github.io/math2phys-site/">math2phys</a></h2>
        <p>수학 논문을 물리학 관점에서 읽고 정리한 노트입니다.</p>
      </li>
    </ul>
    <footer><a href="https://github.com/EuijinJeon">GitHub 프로필</a></footer>
  </main>
</body>
</html>
